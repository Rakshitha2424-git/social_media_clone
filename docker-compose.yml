
services:
  api:
    build: .
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - ./:usr/src/app:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_HOSTNAME: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALGORITHM: ${ALGORITHM:?Set ALGORITHM in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:?Set ACCESS_TOKEN_EXPIRE_MINUTES in .env}

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-db:/var/lib/postgresql

volumes:
  postgres-db:
