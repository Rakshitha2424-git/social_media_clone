
services:
  api:
    build: .
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - ./:usr/src/app:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_HOSTNAME=postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=root@0987
      - DATABASE_NAME=postgres
      - SECRET_KEY=095e3f4b8c1d2a3e4f5g6h7i8j9k0l1m2n3o4p5q6r7s8t9u0v1w2x3y4z5a6b7c8d9
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=300

  postgres:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=root%4009
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-db:/var/lib/postgresql

volumes:
  postgres-db:
